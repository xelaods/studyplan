name: StudyPlan

options:
  bundleIdPrefix: app.studyplan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: ja

targets:
  StudyPlan:
    type: application
    platform: iOS
    sources:
      - path: StudyPlan
        excludes:
          - "**/*.entitlements"
      - path: Shared
    dependencies:
      - target: StudyPlanWidget
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: StudyPlan/StudyPlan.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: StudyPlan/Info.plist
      properties:
        CFBundleDisplayName: 出席・時間割
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: ウィジェットに時間割を表示するため、カレンダーの2001年1月3日に時間割のメモを1件だけ保存します。ほかの予定を読んだり書き換えたりはしません。
        NSCalendarsUsageDescription: ウィジェットに時間割を表示するため、カレンダーに時間割のメモを1件だけ保存します。
        CFBundleURLTypes:
          - CFBundleURLName: app.studyplan.open
            CFBundleURLSchemes:
              - studyplan

  StudyPlanWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StudyPlanWidget
        excludes:
          - "**/*.entitlements"
      - path: Shared
    configFiles:
      Debug: Config/Widget.xcconfig
      Release: Config/Widget.xcconfig
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: StudyPlanWidget/StudyPlanWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: StudyPlanWidget/Info.plist
      properties:
        CFBundleDisplayName: 出席・時間割
        CFBundleDevelopmentRegion: ja
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSCalendarsFullAccessUsageDescription: アプリが保存した時間割のメモを読み込んで表示します。

  StudyPlanTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StudyPlanTests
    dependencies:
      - target: StudyPlan
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  StudyPlan:
    build:
      targets:
        StudyPlan: all
        StudyPlanWidget: all
    test:
      targets:
        - StudyPlanTests
